<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Car Service - Admin Dashboard</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; }
.navbar { background: #007bff; color: #fff; padding: 15px 20px; display:flex; justify-content:space-between; align-items:center; }
.navbar h1 { margin:0; font-size:24px; }
.navbar span { font-size:18px; }
.container { max-width: 1200px; margin: 20px auto; background: #fff; padding: 20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:40px; }
h2 { margin-top:0; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
th { background-color: #007bff; color: white; }
tr:nth-child(even) { background-color: #f9f9f9; }
.action-btn { padding:6px 12px; border:none; border-radius:4px; cursor:pointer; margin:2px; }
.complete-btn { background:#28a745;color:#fff; } .complete-btn:hover{background:#218838;}
.delete-btn { background:#dc3545;color:#fff; } .delete-btn:hover{background:#c82333;}
.message-btn { background:#ffc107;color:#333; } .message-btn:hover{background:#e0a800;}
.add-item { margin-top: 10px; display:flex; gap:5px; }
.add-item input, .add-item button { padding:6px; }
#userModal { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000; }
#userModal .modal-content { background:#fff; padding:20px; border-radius:10px; width:600px; max-height:90vh; overflow-y:auto; position:relative; }
#userModal .closeBtn { position:absolute; top:10px; right:10px; background:#dc3545; color:#fff; border:none; border-radius:50%; width:25px; height:25px; cursor:pointer; font-weight:bold; }
canvas { max-height:300px; margin-top:20px; }
.reports button { margin-right:5px; padding:6px 12px; }
input[type="text"], input[type="number"] { width: 100%; padding:6px; box-sizing: border-box; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="navbar">
  <h1>Admin Dashboard</h1>
  <span>Total Bookings: <strong id="totalBookings">0</strong></span>
  <div>
    <button onclick="location.href='/admin.html'">Admin</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <h2>All Bookings</h2>
  <table>
    <thead>
      <tr>
        <th>Booking ID</th>
        <th>User Name</th>
        <th>Email</th>
        <th>Car Model</th>
        <th>Service Type</th>
        <th>Date</th>
        <th>Total Amount (₹)</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody"></tbody>
  </table>
</div>

<div class="container">
  <h2>Manage Services</h2>
  <div class="add-item">
    <input type="text" id="serviceName" placeholder="Service Name">
    <input type="number" id="servicePrice" placeholder="Price">
    <button onclick="addService()">Add Service</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Service ID</th>
        <th>Name</th>
        <th>Price (₹)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="serviceTableBody"></tbody>
  </table>
</div>

<div class="container">
  <h2>Manage Cars</h2>
  <div class="add-item">
    <input type="text" id="carName" placeholder="Car Model Name">
    <input type="number" id="carMultiplier" placeholder="Multiplier" step="0.1">
    <input type="number" id="carPrice" placeholder="Price">
    <button onclick="addCar()">Add Car</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Car ID</th>
        <th>Model Name</th>
        <th>Multiplier</th>
        <th>Price (₹)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="carTableBody"></tbody>
  </table>
</div>

<div class="container reports">
  <h2>Booking Reports</h2>
  <button onclick="fetchReport('weekly')">Last Week</button>
  <button onclick="fetchReport('monthly')">Last Month</button>
  <button onclick="fetchReport('6months')">Last 6 Months</button>
  <button onclick="fetchReport('yearly')">Last Year</button>
  <canvas id="reportChart"></canvas>
</div>

<!-- User Details Modal -->
<div id="userModal">
  <div class="modal-content">
    <button class="closeBtn" onclick="closeUserModal()">×</button>
    <div id="userDetails"></div>
    <canvas id="userBookingsChart"></canvas>
    <canvas id="userStatusChart"></canvas>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
if(!token){ alert("Please login first!"); window.location.href="/login.html"; }

function logout(){ localStorage.removeItem("token"); window.location.href="/login.html"; }

// ================= Bookings =================
async function fetchBookings(){
  try{
    const res = await fetch("/admin/bookings",{headers:{"Authorization":"Bearer "+token}});
    const bookings = await res.json();
    const tbody = document.getElementById("bookingTableBody");
    tbody.innerHTML="";
    if(!Array.isArray(bookings)) {
      console.error("Unexpected bookings response:", bookings);
      return;
    }
    document.getElementById("totalBookings").innerText = bookings.length;
    bookings.forEach(b=>{
      const tr = document.createElement("tr");
      tr.innerHTML=`
        <td>${b._id}</td>
        <td><a href="javascript:void(0)" onclick="viewUser('${b.email}')">${b.customerName || "N/A"}</a></td>
        <td>${b.email || "N/A"}</td>
        <td>${b.carModel || "N/A"}</td>
        <td>${b.serviceType || "N/A"}</td>
        <td>${b.date ? new Date(b.date).toLocaleDateString() : "N/A"}</td>
        <td>${b.totalAmount || 0}</td>
        <td id="status-${b._id}">${b.status || "Pending"}</td>
        <td>
          ${b.status!=="Completed"?`<button class="action-btn complete-btn" onclick="markCompleted('${b._id}')">Completed</button>`:"✔ Completed"}
          <button class="action-btn delete-btn" onclick="deleteBooking('${b._id}')">Delete</button>
          <button class="action-btn message-btn" onclick="sendMessage('${b._id}')">Message</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }catch(err){ console.error(err); alert("Error fetching bookings"); }
}

async function markCompleted(id){
  if(!confirm("Mark this booking as completed?")) return;
  try{
    const res = await fetch(`/admin/bookings/${id}/complete`,{method:"POST", headers:{"Authorization":"Bearer "+token}});
    const result = await res.json();
    if(result.success){ document.getElementById(`status-${id}`).innerText="Completed"; alert("Booking marked as completed."); }
    else alert(result.message || "Error updating status");
  }catch(err){ console.error(err); alert("Server error"); }
}

async function deleteBooking(id){
  if(!confirm("Are you sure to delete this booking?")) return;
  try{
    const res = await fetch(`/admin/bookings/${id}`,{method:"DELETE", headers:{"Authorization":"Bearer "+token}});
    const result = await res.json();
    if(result.success){ alert("Booking deleted!"); fetchBookings(); }
    else alert(result.message || "Error deleting booking");
  }catch(err){ console.error(err); alert("Server error"); }
}

async function sendMessage(id){
  const message = prompt("Enter message to user:");
  if(!message) return;
  try{
    const res = await fetch(`/admin/bookings/${id}/message`,{method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body:JSON.stringify({message})});
    const result = await res.json();
    if(result.success) alert("Message sent successfully!"); else alert(result.message || "Error sending message");
  }catch(err){ console.error(err); alert("Server error"); }
}

// ================= Services =================
async function fetchServices(){
  try{
    const res = await fetch("/admin/services",{headers:{"Authorization":"Bearer "+token}});
    const services = await res.json();
    const tbody = document.getElementById("serviceTableBody");
    tbody.innerHTML="";
    if(!Array.isArray(services)) { console.error("Unexpected services:", services); return; }
    services.forEach(s=>{
      const tr = document.createElement("tr");
      tr.innerHTML=`<td>${s._id}</td>
        <td><input type="text" value="${s.name}" id="name-${s._id}"></td>
        <td><input type="number" value="${s.price}" id="price-${s._id}"></td>
        <td>
          <button class="action-btn complete-btn" onclick="updateService('${s._id}')">Update</button>
          <button class="action-btn delete-btn" onclick="deleteService('${s._id}')">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }catch(err){ console.error(err); alert("Error fetching services"); }
}

async function addService(){
  const name = document.getElementById("serviceName").value.trim();
  const price = Number(document.getElementById("servicePrice").value);
  if(!name||!price){ alert("Enter valid name and price"); return; }
  try{
    const res = await fetch("/admin/services",{method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body:JSON.stringify({name,price})});
    const result = await res.json();
    if(result.success){ alert("Service added!"); document.getElementById("serviceName").value=""; document.getElementById("servicePrice").value=""; fetchServices(); }
    else alert(result.message || "Error adding service");
  }catch(err){ console.error(err); alert("Server error adding service"); }
}

async function updateService(id){
  const name = document.getElementById(`name-${id}`).value.trim();
  const price = Number(document.getElementById(`price-${id}`).value);
  if(!name||!price){ alert("Enter valid name and price"); return; }
  try{
    const res = await fetch(`/admin/services/${id}`,{method:"PUT", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body:JSON.stringify({name,price})});
    const result = await res.json();
    if(result.success){ alert("Service updated!"); fetchServices(); }
    else alert(result.message || "Error updating service");
  }catch(err){ console.error(err); alert("Server error updating service"); }
}

async function deleteService(id){
  if(!confirm("Delete this service?")) return;
  try{
    const res = await fetch(`/admin/services/${id}`,{method:"DELETE", headers:{"Authorization":"Bearer "+token}});
    const result = await res.json();
    if(result.success){ alert("Service deleted!"); fetchServices(); }
    else alert(result.message || "Error deleting service");
  }catch(err){ console.error(err); alert("Server error deleting service"); }
}

// ================= Cars (with Update) =================
async function fetchCars(){
  try{
    const res = await fetch("/admin/cars", { headers: {"Authorization":"Bearer "+token} });
    const data = await res.json();
    const tbody = document.getElementById("carTableBody");
    tbody.innerHTML = "";
    if(!Array.isArray(data)){ console.error("Unexpected cars:", data); return; }
    data.forEach(car=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${car._id}</td>
        <td><input type="text" value="${car.name}" id="car-name-${car._id}"></td>
        <td><input type="number" step="0.1" value="${car.multiplier || 1}" id="car-mult-${car._id}"></td>
        <td><input type="number" value="${car.price || 0}" id="car-price-${car._id}"></td>
        <td>
          <button class="action-btn complete-btn" onclick="updateCar('${car._id}')">Update</button>
          <button class="action-btn delete-btn" onclick="deleteCar('${car._id}')">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }catch(err){
    console.error("Error fetching cars:", err);
    alert("Error fetching cars");
  }
}

async function addCar(){
  const name=document.getElementById("carName").value.trim();
  const multiplier=Number(document.getElementById("carMultiplier").value) || 1;
  const price=Number(document.getElementById("carPrice").value) || 0;
  if(!name){ alert("Enter car name"); return; }
  try{
    const res=await fetch("/admin/cars",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({ name, multiplier, price })
    });
    const result=await res.json();
    if(result.success){
      alert("Car added!");
      document.getElementById("carName").value="";
      document.getElementById("carMultiplier").value="";
      document.getElementById("carPrice").value="";
      fetchCars();
    }else{
      alert(result.message || "Error adding car");
    }
  }catch(err){ console.error(err); alert("Server error adding car"); }
}

async function updateCar(id){
  const name=document.getElementById(`car-name-${id}`).value.trim();
  const multiplier=Number(document.getElementById(`car-mult-${id}`).value) || 1;
  const price=Number(document.getElementById(`car-price-${id}`).value) || 0;

  if(!name){ alert("Enter car name"); return; }
  try{
    const res=await fetch(`/admin/cars/${id}`,{
      method:"PUT",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({ name, multiplier, price })
    });
    const result=await res.json();
    if(result.success){
      alert("Car updated!");
      fetchCars();
    }else{
      alert(result.message || "Error updating car");
    }
  }catch(err){ console.error(err); alert("Server error updating car"); }
}

async function deleteCar(id){
  if(!confirm("Delete this car?")) return;
  try{
    const res=await fetch(`/admin/cars/${id}`,{
      method:"DELETE",
      headers:{"Authorization":"Bearer "+token}
    });
    const result=await res.json();
    if(result.success){
      alert("Car deleted!");
      fetchCars();
    }else{
      alert(result.message || "Error deleting car");
    }
  }catch(err){ console.error(err); alert("Server error deleting car"); }
}
// ================= Reports =================
async function fetchReport(range){
  try{
    const res = await fetch(`/bookings/analytics?range=${range}`, {
      headers: {"Authorization": "Bearer " + token}
    });
    const data = await res.json();
    if(!data.success){ alert("Error fetching report"); return; }

    const ctx = document.getElementById("reportChart").getContext("2d");
    if(window.reportChart) window.reportChart.destroy();

    // Set chart type dynamically
    let chartType = 'bar';
    if(range === 'weekly') chartType = 'line'; // line chart for weekly

    window.reportChart = new Chart(ctx, {
      type: chartType,
      data: {
        labels: data.revenue.map(r => r.month), // month can be date label for weekly
        datasets: [{
          label: 'Revenue (₹)',
          data: data.revenue.map(r => r.amount),
          backgroundColor: chartType === 'bar' ? '#007bff' : 'rgba(0,123,255,0.2)',
          borderColor: chartType === 'line' ? '#007bff' : '',
          borderWidth: 2,
          fill: chartType === 'line',
          tension: chartType === 'line' ? 0.3 : 0 // smooth curve for line
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          title: { display: true, text: `Revenue Report (${range})` },
          tooltip: {
            callbacks: {
              label: function(context) {
                return `Revenue: ₹${context.raw}`;
              }
            }
          }
        },
        scales: {
          y: { beginAtZero: true },
          x: { ticks: { autoSkip: false } }
        }
      }
    });
  } catch(err){
    console.error(err);
    alert("Error fetching report");
  }
}
async function fetchReport(range){
  try{
    const res = await fetch(`/bookings/analytics?range=${range}`, {
      headers: {"Authorization": "Bearer " + token}
    });
    const data = await res.json();
    if(!data.success){ alert("Error fetching report"); return; }

    const ctx = document.getElementById("reportChart").getContext("2d");
    if(window.reportChart) window.reportChart.destroy();

    const labels = data.revenue.map(r => r.label); // use 'label' for dynamic ranges
    const amounts = data.revenue.map(r => r.amount);

    window.reportChart = new Chart(ctx, {
      type: range === "weekly" ? "line" : "bar",
      data: {
        labels: labels,
        datasets: [{
          label: "Revenue (₹)",
          data: amounts,
          backgroundColor: range === "weekly" ? "rgba(0,123,255,0.2)" : "#007bff",
          borderColor: "#007bff",
          borderWidth: 2,
          fill: range === "weekly",
          tension: range === "weekly" ? 0.3 : 0
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          title: { display: true, text: `Revenue Report (${range})` },
          tooltip: {
            callbacks: {
              label: function(context) { return `Revenue: ₹${context.raw}`; }
            }
          }
        },
        scales: {
          y: { beginAtZero: true },
          x: { ticks: { autoSkip: false } }
        }
      }
    });
  } catch(err){
    console.error(err);
    alert("Error fetching report");
  }
}

// ================= User Modal =================
async function viewUser(email){
  try{
    const res = await fetch(`/admin/user/email/${email}`,{headers:{"Authorization":"Bearer "+token}});
    const user = await res.json();
    if(!user.success){ alert("Error fetching user info"); return; }
    document.getElementById("userDetails").innerHTML=`
      <h2>${user.user.username || "N/A"}</h2>
      <p><strong>Email:</strong> ${user.user.email || "N/A"}</p>
      <p><strong>Loyalty Points:</strong> ${user.user.loyaltyPoints || 0}</p>
      <h3>Bookings:</h3>
      <ul>${user.bookings.map(b=>`<li>${b.carModel} - ${b.serviceType} - ${new Date(b.date).toLocaleDateString()} (${b.status})</li>`).join('')}</ul>
    `;
    const completed=user.bookings.filter(b=>b.status==="Completed").length;
    const pending=user.bookings.filter(b=>b.status==="Pending").length;
    const ctxStatus=document.getElementById('userStatusChart').getContext('2d');
    if(window.userStatusChart) window.userStatusChart.destroy();
    window.userStatusChart=new Chart(ctxStatus,{type:'doughnut', data:{labels:['Completed','Pending'],datasets:[{data:[completed,pending], backgroundColor:['#28a745','#ff4d4d']}]}, options:{responsive:true, plugins:{legend:{position:'bottom'}}}});
    const labels=user.bookings.map(b=>new Date(b.date).toLocaleDateString());
    const revenue=user.bookings.map(b=>b.totalAmount || 0);
    const ctxBooking=document.getElementById('userBookingsChart').getContext('2d');
    if(window.userBookingsChart) window.userBookingsChart.destroy();
    window.userBookingsChart=new Chart(ctxBooking,{type:'bar', data:{labels,datasets:[{label:'Booking Amount',data:revenue,backgroundColor:'#007bff'}]}, options:{responsive:true, scales:{y:{beginAtZero:true}}}});
    document.getElementById("userModal").style.display="flex";
  }catch(err){ console.error(err); alert("Error fetching user data"); }
}
function closeUserModal(){ document.getElementById("userModal").style.display="none"; }

// ================= Reports =================
async function fetchReport(range){
  try{
    const res=await fetch(`/bookings/analytics?range=${range}`,{headers:{"Authorization":"Bearer "+token}});
    const data=await res.json();
    if(!data.success){ alert("Error fetching report"); return; }
    const ctx=document.getElementById("reportChart").getContext("2d");
    if(window.reportChart) window.reportChart.destroy();
    window.reportChart=new Chart(ctx,{type:'bar', data:{labels:data.revenue.map(r=>r.month), datasets:[{label:'Revenue', data:data.revenue.map(r=>r.amount), backgroundColor:'#007bff'}]}, options:{responsive:true, scales:{y:{beginAtZero:true}}}});
  }catch(err){ console.error(err); alert("Error fetching report"); }
}

// ================= Init =================
document.addEventListener("DOMContentLoaded", ()=>{
  fetchBookings();
  fetchServices();
  fetchCars();
});
</script>
</body>
</html>
