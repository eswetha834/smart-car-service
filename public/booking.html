<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Service - Smart Car Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter', sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
  
  .booking-container { max-width:700px; margin:40px auto; padding:20px; }
  
  .booking-header { text-align:center; margin-bottom:32px; }
  .booking-header h1 { font-size:28px; font-weight:700; color:#fff; margin-bottom:8px; }
  .booking-header p { color:#94a3b8; font-size:14px; }
  
  .booking-card { background:linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border-radius:16px; padding:32px; border:1px solid #334155; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); margin-bottom:24px; }
  
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; }
  
  .form-group { margin-bottom:20px; }
  .form-label { display:block; font-size:14px; color:#94a3b8; margin-bottom:8px; font-weight:500; }
  .form-input, .form-select { width:100%; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:14px 16px; color:#e2e8f0; font-size:15px; transition:all 0.3s ease; cursor:pointer; }
  .form-input:focus, .form-select:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59, 130, 246, 0.1); }
  .form-input::placeholder { color:#64748b; }
  
  .btn { width:100%; padding:14px; border-radius:10px; font-weight:600; font-size:15px; cursor:pointer; transition:all 0.3s ease; border:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary { background:linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color:#fff; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(59, 130, 246, 0.4); }
  .btn-paypal { background:#ffc439; color:#000; }
  .btn-razorpay { background:#007bff; color:#fff; }
  .btn-paytm { background:#ff8c00; color:#fff; }
  .btn-gpay { background:#34a853; color:#fff; }
  
  .price-card { background:linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border-radius:12px; padding:20px; margin-top:24px; color:#fff; }
  .price-row { display:flex; justify-content:space-between; margin-bottom:12px; }
  .price-row:last-child { margin-bottom:0; }
  .price-label { opacity:0.9; }
  .price-value { font-weight:700; font-size:18px; }
  .total-price { border-top:1px solid rgba(255,255,255,0.3); padding-top:16px; margin-top:16px; }
  
  .coupon-section { background:#0f172a; border-radius:12px; padding:20px; margin-top:20px; border:1px solid #334155; }
  .coupon-input-group { display:flex; gap:12px; }
  
  #message { margin-top:16px; padding:12px; border-radius:8px; text-align:center; font-weight:500; display:none; }
  #message.success { background:rgba(16, 185, 129, 0.1); color:#10b981; border:1px solid #10b981; }
  #message.error { background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid #ef4444; }
  
  .hidden { display:none; }
  
  .back-link { display:inline-flex; align-items:center; gap:8px; color:#94a3b8; text-decoration:none; margin-bottom:20px; font-size:14px; }
  .back-link:hover { color:#3b82f6; }
</style>
</head>
<body>

<div class="booking-container">
  <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
  
  <div class="booking-header">
    <h1><i class="fas fa-calendar-plus" style="margin-right:12px; color:#3b82f6;"></i>Book a Service</h1>
    <p>Schedule your car service appointment</p>
  </div>
  
  <div class="booking-card">
    <form id="bookingForm">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Customer Name</label>
          <input type="text" name="customerName" class="form-input" placeholder="Enter your name" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="Enter your email">
        </div>
        
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-input" placeholder="10-digit number" maxlength="10" pattern="\d{10}" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Car Model</label>
          <select name="carModel" id="carModel" class="form-select" required>
            <option value="">Select Car Model</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Service Type</label>
          <select name="serviceType" id="serviceType" class="form-select" required>
            <option value="">Select Service</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Recurring Service</label>
          <select name="recurring" id="recurring" class="form-select">
            <option value="none">One-time</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
          </select>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Preferred Date</label>
        <input type="text" id="datePicker" name="date" class="form-input" placeholder="Select date" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Payment Method</label>
        <select name="paymentMethod" id="paymentMethod" class="form-select" required>
          <option value="">Select Payment Method</option>
          <option value="paypal">PayPal</option>
          <option value="razorpay">Razorpay</option>
          <option value="paytm">Paytm</option>
          <option value="gpay">Google Pay</option>
          <option value="cod">Cash on Delivery</option>
        </select>
      </div>
      
      <div class="coupon-section">
        <label class="form-label"><i class="fas fa-tag" style="margin-right:8px;"></i>Apply Coupon Code</label>
        <div class="coupon-input-group">
          <input type="text" id="couponCode" class="form-input" placeholder="Enter coupon code">
          <button type="button" id="applyCouponBtn" class="btn btn-primary" style="width:auto; padding:14px 24px;">Apply</button>
        </div>
        <p id="discountInfo" style="margin-top:12px; color:#10b981; font-size:14px;">Discount: ₹0</p>
      </div>
      
      <div class="price-card">
        <div class="price-row">
          <span class="price-label">Service Price</span>
          <span class="price-value" id="servicePrice">₹0</span>
        </div>
        <div class="price-row">
          <span class="price-label">Car Multiplier</span>
          <span class="price-value" id="carMultiplier">1x</span>
        </div>
        <div class="price-row total-price">
          <span class="price-label">Total Amount</span>
          <span class="price-value" id="totalAmount">₹0</span>
        </div>
      </div>
      
      <button type="button" id="proceedPay" class="btn hidden" style="margin-top:20px;">Proceed to Pay</button>
      <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top:12px;">
        <i class="fas fa-check-circle"></i> Submit Booking
      </button>
    </form>
    
    <div id="message"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const token = localStorage.getItem("token");
if(!token){ alert("Please login first"); window.location.href="/login.html"; }

let fullyBookedDates = [];
let fpInstance = null;

const carModelSelect = document.getElementById("carModel");
const serviceTypeSelect = document.getElementById("serviceType");
const paymentSelect = document.getElementById("paymentMethod");
const totalAmountDiv = document.getElementById("totalAmount");
async function fetchCars() {
  const token = localStorage.getItem("token");
  try {
    const res = await fetch("/bookings/cars", {
      headers: { "Authorization": "Bearer " + token },
    });
    const cars = await res.json();

    const carSelect = document.getElementById("car");
    carSelect.innerHTML = cars
      .map(c => `<option value="${c._id}">${c.name} - ₹${c.price}</option>`)
      .join("");
  } catch (err) {
    console.error("Error fetching cars:", err);
  }
}
async function fetchServices() {
  try {
    const res = await fetch("/bookings/services");
    const services = await res.json();

    const serviceSelect = document.getElementById("service");
    serviceSelect.innerHTML = services
      .map(s => `<option value="${s._id}">${s.name} - ₹${s.price}</option>`)
      .join("");
  } catch (err) {
    console.error("Error fetching services:", err);
  }
}
async function fetchBookedDates() {
  const token = localStorage.getItem("token");
  try {
    const res = await fetch("/bookings/dates", {
      headers: { "Authorization": "Bearer " + token },
    });
    const data = await res.json();

    if (data.success && data.fullyBooked.length > 0) {
      flatpickr("#date", {
        disable: data.fullyBooked,
        dateFormat: "Y-m-d",
      });
    } else {
      flatpickr("#date", { dateFormat: "Y-m-d" });
    }
  } catch (err) {
    console.error("Error fetching booked dates:", err);
    flatpickr("#date", { dateFormat: "Y-m-d" });
  }
}
async function submitBooking(event) {
  event.preventDefault();
  const token = localStorage.getItem("token");

  const carId = document.getElementById("car").value;
  const serviceId = document.getElementById("service").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const notes = document.getElementById("notes").value;

  try {
    const res = await fetch("/bookings", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
      },
      body: JSON.stringify({ carId, serviceId, date, time, notes }),
    });

    const data = await res.json();
    if (data.success) {
      alert("✅ Booking successful!");
      document.getElementById("bookingForm").reset();
    } else {
      alert("⚠️ " + (data.message || "Booking failed"));
    }
  } catch (err) {
    console.error("Error creating booking:", err);
    alert("⚠️ Error creating booking");
  }
}
document.addEventListener("DOMContentLoaded", () => {
  fetchCars();
  fetchServices();
  fetchBookedDates();

  const bookingForm = document.getElementById("bookingForm");
  if (bookingForm) bookingForm.addEventListener("submit", submitBooking);
});
// ---------------- Load Cars ----------------
async function loadCars() {
  try {
    const token = localStorage.getItem("token");
    const res = await fetch("/booking/cars", {  // matches backend
      headers: { "Authorization": "Bearer " + token }
    });
    const cars = await res.json();

    if (!Array.isArray(cars) || cars.length === 0) {
      carModelSelect.innerHTML = '<option value="">No cars available</option>';
      return;
    }

    carModelSelect.innerHTML = '<option value="">Select Car Model</option>';
    cars.forEach(c => {
      const option = document.createElement("option");
      option.value = c._id;                   // use _id for booking
      option.dataset.price = c.price || 500;
      option.dataset.multiplier = c.multiplier || 1;
      option.innerText = `${c.name} - ₹${c.price ?? 0}`;
      carModelSelect.appendChild(option);
    });
    updateTotalDisplay();
  } catch (err) {
    console.error("Error loading cars:", err);
    carModelSelect.innerHTML = '<option value="">Error loading cars</option>';
  }
}

// ---------------- Load Services ----------------
async function loadServices() {
  try {
    const res = await fetch("/services"); // services route (public)
    const services = await res.json();

    if (!Array.isArray(services) || services.length === 0) {
      serviceTypeSelect.innerHTML = '<option value="">No services available</option>';
      return;
    }

    serviceTypeSelect.innerHTML = '<option value="">Select Service</option>';
    services.forEach(s => {
      const option = document.createElement("option");
      option.value = s._id;
      option.dataset.name = s.name;
      option.dataset.price = s.price;
      option.innerText = `${s.name} - ₹${s.price}`;
      serviceTypeSelect.appendChild(option);
    });
    updateTotalDisplay();
  } catch (err) {
    console.error("Error loading services:", err);
    serviceTypeSelect.innerHTML = '<option value="">Error loading services</option>';
  }
}

// ---------------- Load Fully Booked Dates ----------------
async function loadFullyBookedDates(){
  try {
    const res = await fetch("/bookings/dates", { headers:{ Authorization:"Bearer "+token } });
    const data = await res.json();
    if(data && data.success){
      fullyBookedDates = data.fullyBooked || [];
      fpInstance = flatpickr("#datePicker", {
        minDate:"today",
        disable: fullyBookedDates,
        onDayCreate: (dObj, dStr, fp, dayElem) => {
          const dateStr = dayElem.dateObj.toISOString().split("T")[0];
          if(fullyBookedDates.includes(dateStr)){
            dayElem.style.backgroundColor="#ff4d4d";
            dayElem.style.color="#fff";
            dayElem.style.borderRadius="50%";
            dayElem.style.cursor="not-allowed";
          }
        }
      });
    } else {
      fpInstance = flatpickr("#datePicker", { minDate:"today" });
    }
  } catch(err){ console.error(err); fpInstance = flatpickr("#datePicker", { minDate:"today" }); }
}

// ---------------- Calculate Total ----------------
function calculateTotal(){
  const selectedCar = carModelSelect.selectedOptions[0];
  const selectedService = serviceTypeSelect.selectedOptions[0];
  const carPrice = parseInt(selectedCar?.dataset.price || 0);
  const carMultiplier = parseFloat(selectedCar?.dataset.multiplier || 1);
  const servicePrice = parseInt(selectedService?.dataset.price || 0);
  return Math.round((carPrice + servicePrice) * carMultiplier);
}

function updateTotalDisplay(){
  const total = calculateTotal();
  const selectedCar = carModelSelect.selectedOptions[0];
  const selectedService = serviceTypeSelect.selectedOptions[0];
  
  document.getElementById("servicePrice").innerText = "₹" + (selectedService?.dataset.price || 0);
  document.getElementById("carMultiplier").innerText = (selectedCar?.dataset.multiplier || 1) + "x";
  document.getElementById("totalAmount").innerText = "₹" + total;
  
  if(paymentSelect.value === "cod"){
    document.getElementById("totalAmount").style.display = "block";
  } else {
    document.getElementById("totalAmount").style.display = "block";
  }
}

carModelSelect.addEventListener("change", updateTotalDisplay);
serviceTypeSelect.addEventListener("change", updateTotalDisplay);
paymentSelect.addEventListener("change", updateTotalDisplay);

// ---------------- Payment Button ----------------
document.getElementById("paymentMethod").addEventListener("change", e=>{
  const proceedBtn=document.getElementById("proceedPay");
  proceedBtn.classList.add("hidden");
  proceedBtn.className = "btn hidden";
  switch(e.target.value){
    case "paypal": proceedBtn.classList.remove("hidden"); proceedBtn.classList.add("btn-paypal"); proceedBtn.innerHTML='<i class="fab fa-paypal"></i> Proceed with PayPal'; break;
    case "razorpay": proceedBtn.classList.remove("hidden"); proceedBtn.classList.add("btn-razorpay"); proceedBtn.innerHTML='<i class="fas fa-credit-card"></i> Proceed with Razorpay'; break;
    case "paytm": proceedBtn.classList.remove("hidden"); proceedBtn.classList.add("btn-paytm"); proceedBtn.innerHTML='<i class="fas fa-mobile-alt"></i> Proceed with Paytm'; break;
    case "gpay": proceedBtn.classList.remove("hidden"); proceedBtn.classList.add("btn-gpay"); proceedBtn.innerHTML='<i class="fab fa-google"></i> Proceed with Google Pay'; break;
    case "cod": proceedBtn.classList.add("hidden"); updateTotalDisplay(); break;
    default: proceedBtn.classList.add("hidden"); break;
  }
});

// ---------------- Submit Booking ----------------
async function submitBooking(data){
  try {
    const res = await fetch("/bookings", {
      method:"POST",
      headers: {"Content-Type":"application/json","Authorization":"Bearer "+token},
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if(result.success){
      showMessage("Booking submitted successfully!", "success");
      if(fpInstance && data.date){
        const current = fpInstance.config.disable || [];
        if(!current.includes(data.date)) {
          fpInstance.set("disable", [...current, data.date]);
        }
      }
      document.getElementById("bookingForm").reset();
      document.getElementById("totalAmount").innerText = "₹0";
      document.getElementById("servicePrice").innerText = "₹0";
      document.getElementById("carMultiplier").innerText = "1x";
    } else {
      showMessage(result.message || "Booking failed", "error");
    }
  } catch(err){
    console.error(err);
    showMessage("Server error. Please try again.", "error");
  }
}

// ---------------- COD Submit ----------------
document.getElementById("bookingForm").addEventListener("submit", async e=>{
  e.preventDefault();
  if(paymentSelect.value !== "cod") return;
  const f = e.target;
  const selectedService = serviceTypeSelect.selectedOptions[0];
  if(!selectedService) { alert("Select a service"); return; }
  const bookingData = {
    customerName: f.customerName.value,
    email: f.email.value,
    phone: f.phone.value,
    carModel: f.carModel.value,
    serviceType: selectedService.dataset.name,
    serviceId: selectedService.value,
    recurring: f.recurring.value,
    date: f.date.value,
    paymentMethod: "cod",
    totalAmount: calculateTotal(),
    status: "Pending"
  };
  await submitBooking(bookingData);
});

// ---------------- Show Message ----------------
function showMessage(text, type){
  const msg = document.getElementById("message");
  msg.innerText = text;
  msg.className = type;
  msg.style.display = "block";
  setTimeout(() => { msg.style.display = "none"; }, 5000);
}
// ---------------- Load Cars ----------------
async function loadCars(){
  try {
    const res = await fetch("/booking/cars", { // <-- corrected route
      headers: { "Authorization": "Bearer " + token }
    });
    const cars = await res.json();
    
    if(!Array.isArray(cars) || cars.length === 0){
      carModelSelect.innerHTML = '<option value="">No cars available</option>';
      return;
    }

    carModelSelect.innerHTML = '<option value="">Select Car Model</option>';
    cars.forEach(c => {
      const option = document.createElement("option");
      option.value = c._id; // use _id for booking
      option.dataset.price = c.price || 500;
      option.dataset.multiplier = c.multiplier || 1;
      option.innerText = `${c.name} - ₹${c.price ?? 0}`;
      carModelSelect.appendChild(option);
    });
    updateTotalDisplay();
  } catch(err){
    console.error("Error loading cars:", err);
    carModelSelect.innerHTML = '<option value="">Error loading cars</option>';
  }
}

// ---------------- Load Services ----------------
async function loadServices(){
  try {
    const res = await fetch("/services"); // keep this if services are public
    const services = await res.json();

    if(!Array.isArray(services) || services.length === 0){
      serviceTypeSelect.innerHTML = '<option value="">No services available</option>';
      return;
    }

    serviceTypeSelect.innerHTML = '<option value="">Select Service</option>';
    services.forEach(s => {
      const option = document.createElement("option");
      option.value = s._id;
      option.dataset.name = s.name;
      option.dataset.price = s.price;
      option.innerText = `${s.name} - ₹${s.price}`;
      serviceTypeSelect.appendChild(option);
    });
    updateTotalDisplay();
  } catch(err){
    console.error("Error loading services:", err);
    serviceTypeSelect.innerHTML = '<option value="">Error loading services</option>';
  }
}

// ---------------- Proceed to Pay ----------------
document.getElementById("proceedPay").addEventListener("click", async ()=>{
  const f = document.getElementById("bookingForm");
  const selectedService = serviceTypeSelect.selectedOptions[0];
  if(!selectedService) { alert("Select a service"); return; }
  const bookingData = {
    customerName: f.customerName.value,
    email: f.email.value,
    phone: f.phone.value,
    carModel: f.carModel.value,
    serviceType: selectedService.dataset.name,
    serviceId: selectedService.value,
    recurring: f.recurring.value,
    date: f.date.value,
    paymentMethod: paymentSelect.value,
    totalAmount: calculateTotal(),
    status: "Pending"
  };
  const total = calculateTotal() * 100; // Razorpay expects paise

  if(paymentSelect.value==="razorpay"){
    const options = {
      key:"RAZORPAY_KEY_HERE",
      amount: total,
      currency:"INR",
      name:"Smart Car Service",
      description:"Service Booking",
      handler: async function(res){
        bookingData.paymentId = res.razorpay_payment_id;
        bookingData.status = "Paid";
        await submitBooking(bookingData);
      },
      prefill:{ name:f.customerName.value, email:f.email.value, contact:f.phone.value },
      theme:{ color:"#007bff" }
    };
    const rzp = new Razorpay(options);
    rzp.open();
  }
  else if(paymentSelect.value==="paypal"){
    // redirect to your backend PayPal flow - this is a simple example
    window.location.href = `/paypal-checkout?name=${encodeURIComponent(bookingData.customerName)}&email=${encodeURIComponent(bookingData.email)}&amount=${bookingData.totalAmount}`;
  }
  else if(paymentSelect.value==="paytm"){
    window.location.href = `/paytm-checkout?name=${encodeURIComponent(bookingData.customerName)}&phone=${encodeURIComponent(bookingData.phone)}&amount=${bookingData.totalAmount}`;
  }
  else if(paymentSelect.value==="gpay"){
    window.location.href = `/gpay-checkout?name=${encodeURIComponent(bookingData.customerName)}&amount=${bookingData.totalAmount}`;
  }
});

// ---------------- Initialize ----------------
document.addEventListener("DOMContentLoaded", ()=>{
  loadCars();
  loadServices();
  loadFullyBookedDates();
});
</script>
</body>
</html>
