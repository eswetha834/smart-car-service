<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Smart Car Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter', sans-serif; background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  
  .register-container { width:100%; max-width:420px; padding:20px; }
  
  .register-card { background:linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border-radius:20px; padding:40px; border:1px solid #334155; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  
  .logo-section { text-align:center; margin-bottom:32px; }
  .logo-icon { width:64px; height:64px; background:linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; font-size:28px; color:#fff; margin-bottom:16px; }
  .logo-title { font-size:24px; font-weight:700; color:#fff; margin-bottom:4px; }
  .logo-subtitle { font-size:14px; color:#94a3b8; }
  
  .form-group { margin-bottom:20px; }
  .form-label { display:block; font-size:14px; color:#94a3b8; margin-bottom:8px; }
  .form-input { width:100%; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:14px 16px; color:#e2e8f0; font-size:15px; transition:all 0.3s ease; }
  .form-input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59, 130, 246, 0.1); }
  .form-input::placeholder { color:#64748b; }
  
  .btn { width:100%; padding:14px; border-radius:10px; font-weight:600; font-size:15px; cursor:pointer; transition:all 0.3s ease; border:none; }
  .btn-primary { background:linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color:#fff; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(59, 130, 246, 0.4); }
  
  .login-link { text-align:center; margin-top:24px; color:#94a3b8; font-size:14px; }
  .login-link a { color:#3b82f6; text-decoration:none; font-weight:500; }
  .login-link a:hover { color:#8b5cf6; }
  
  .features { display:flex; justify-content:center; gap:24px; margin-top:32px; padding-top:24px; border-top:1px solid #334155; }
  .feature { text-align:center; color:#64748b; font-size:12px; }
  .feature i { font-size:20px; color:#3b82f6; margin-bottom:8px; display:block; }
</style>
</head>
<body>

<div class="register-container">
  <div class="register-card">
    <div class="logo-section">
      <div class="logo-icon"><i class="fas fa-car"></i></div>
      <h1 class="logo-title">Smart Car Service</h1>
      <p class="logo-subtitle">Create Your Account</p>
    </div>
    
    <form id="registerForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="Choose a username" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="Enter your email" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="Create a password" required>
      </div>
      
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-user-plus" style="margin-right:8px;"></i> Create Account
      </button>
    </form>
    
    <div class="login-link">
      Already have an account? <a href="/login.html">Sign In</a>
    </div>
    
    <div class="features">
      <div class="feature">
        <i class="fas fa-shield-alt"></i>
        <span>Secure</span>
      </div>
      <div class="feature">
        <i class="fas fa-clock"></i>
        <span>24/7</span>
      </div>
      <div class="feature">
        <i class="fas fa-star"></i>
        <span>Premium</span>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  const data = { username: form.username.value, email: form.email.value, password: form.password.value };
  const res = await fetch("/auth/register", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
  });
  const result = await res.json();
  if (res.ok) {
    localStorage.setItem("token", result.token);
    window.location.href = "/dashboard.html";
  } else {
    alert(result.message);
  }
});
</script>
</body>
</html>
